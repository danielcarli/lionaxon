# Installers for Windows, macOS and Linux, built by GitHub when a version tag is pushed (v0.9.0…),
# or by hand from the Actions tab. Each system builds its own; the files are attached to a draft release
# (for a tag) and kept as artifacts of the run. Nothing is signed: Windows and macOS will warn on the
# first opening until the app has a certificate.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '--win nsis zip --x64' }
          - { os: macos-latest, args: '--mac dmg --universal' }
          - { os: ubuntu-latest, args: '--linux AppImage deb --x64' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npm test
      - run: npx --yes electron-builder@26.18.0 ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: LionAxon-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
