# Installers for Windows, macOS and Linux, built by GitHub when a version tag is pushed (v0.12.0…),
# or by hand from the Actions tab (then the files are only kept as artifacts of the run).
# Each system builds its own installers, with fixed names; a last job writes manifest.txt (read by the
# app when asked to look for a new version), SHA256SUMS.txt and the notes, and publishes the release.
# The links of the README point to releases/latest/download/<name>.
# Nothing is signed: Windows and macOS warn on the first opening until the app has a certificate.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '--win nsis zip --x64' }
          - { os: macos-latest, args: '--mac dmg --universal' }
          - { os: ubuntu-latest, args: '--linux AppImage deb rpm --x64' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci || npm install
      - run: npm test
      - run: npx --yes electron-builder@26.18.0 ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v6
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/LionAxon-Setup.exe
            dist/LionAxon-win-x64.zip
            dist/LionAxon-mac-universal.dmg
            dist/LionAxon-x86_64.AppImage
            dist/lionaxon_amd64.deb
            dist/lionaxon.x86_64.rpm
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: The tag is the version of package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: node tools/make-release.mjs release
      - uses: actions/upload-artifact@v6
        with:
          name: release
          path: release/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: LionAxon ${{ github.ref_name }}
          body_path: release/RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/LionAxon-Setup.exe
            release/LionAxon-win-x64.zip
            release/LionAxon-mac-universal.dmg
            release/LionAxon-x86_64.AppImage
            release/lionaxon_amd64.deb
            release/lionaxon.x86_64.rpm
            release/manifest.txt
            release/SHA256SUMS.txt
